[package]
name = "mechrevoc-tui"
version.workspace = true
edition = "2021"
license.workspace = true
rust-version.workspace = true
description = "mechrevoc TUI 控制台(客户端, 无硬件权限)"

[dependencies]
mechrevoc-core = { workspace = true }
ratatui.workspace = true
crossterm.workspace = true
# 字符显示宽度(全角=2 列),供 Text 组件字符级选区使用(与 ratatui 同款)
unicode-width = "0.2"

# 完整继承 workspace lints;unsafe 禁令通过 crate 属性 #![forbid(unsafe_code)] 声明(见 main.rs)
[lints]
workspace = true
