[package]
name = "mechrevoc-daemon"
version.workspace = true
edition = "2021"
license.workspace = true
rust-version.workspace = true
description = "mechrevoc 守护进程: 唯一接触硬件的常驻服务(systemd)"

[dependencies]
mechrevoc-core = { workspace = true }

# 手动声明(与 workspace.lints 保持同步):因需要追加 unsafe_code = "forbid"
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
